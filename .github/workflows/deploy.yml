name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Upload artifacts to S3
      run: |
        aws s3 sync ./artifacts/ s3://${{ env.S3_BUCKET }}/artifacts/ \
          --exclude "*.csv" \
          --exclude "*.log"
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/zillow-property-predictor
          git pull origin main
          export S3_BUCKET=${{ env.S3_BUCKET }}
          aws s3 sync s3://$S3_BUCKET/artifacts/ ./artifacts/
          docker-compose -f deploy/docker-compose.yml down
          docker-compose -f deploy/docker-compose.yml build
          docker-compose -f deploy/docker-compose.yml up -d
          docker-compose -f deploy/docker-compose.yml logs --tail=50
