version: '3.8'

services:
  zillow-app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ../artifacts:/app/artifacts:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
